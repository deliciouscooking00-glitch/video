<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр урока</title>
    <script src="https://telegram.org"></script>
    <script src="https://kinescope.io"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #player { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Достаем ID видео прямо из параметров ссылки
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id') || tg.initDataUnsafe?.start_param;

        if (videoId) {
            const user = tg.initDataUnsafe?.user;
            const userData = user ? `${user.first_name} (ID: ${user.id})` : "Защищенный просмотр";

            Kinescope.IframePlayer.create('player', {
                url: `https://kinescope.io{videoId}`,
                watermark: {
                    text: userData,
                    mode: 'item',
                    scale: 1,
                    opacity: 0.35
                }
            }).catch(function(error) {
                document.getElementById('player').innerHTML = '<div style="color:#fff; text-align:center; padding-top:45vh; font-family:sans-serif;">Ошибка загрузки видео. Проверьте тариф Kinescope.</div>';
            });
        } else {
            document.getElementById('player').innerHTML = '<div style="color:#fff; text-align:center; padding-top:45vh; font-family:sans-serif;">Видео не найдено. Откройте ссылку из канала.</div>';
        }
    </script>
</body>
</html>
