<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр урока</title>
    <!-- Подключаем библиотеку Telegram, чтобы сайт умел читать данные ученика -->
    <script src="https://telegram.org"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #player-container { position: relative; padding-top: 56.25%; width: 100%; height: 100%; }
        iframe { border: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="player-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем окно на весь экран телефона

        // 1. Автоматически забираем ID видео из ссылки Telegram (?startapp=ID)
        const videoId = tg.initDataUnsafe?.start_param;
        const container = document.getElementById('player-container');

        if (videoId) {
            // 2. Забираем имя и ID ученика из Telegram для водяного знака
            const user = tg.initDataUnsafe?.user;
            const userData = user ? `${user.first_name}_ID_${user.id}` : "Защищенный_просмотр";

            // 3. Собираем ссылку Kinescope, подставляя ID урока и водяной знак
            const kinescopeUrl = `https://kinescope.io{videoId}?watermark=${encodeURIComponent(userData)}`;

            // 4. Вставляем ВАШ ТОЧНЫЙ КОД ИЗ КИНЕСКОПА, но с динамической ссылкой
            container.innerHTML = `<iframe src="${kinescopeUrl}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;" frameborder="0" allowfullscreen style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;"></iframe>`;
        } else {
            container.innerHTML = '<div style="color:#fff; text-align:center; padding-top:40vh; font-family:sans-serif;">Видео не найдено. Перейдите по ссылке из канала.</div>';
        }
    </script>
</body>
</html>
