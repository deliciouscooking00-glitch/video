<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр урока</title>
    <!-- Подключаем библиотеку Telegram, чтобы сайт умел читать данные ученика -->
    <script src="https://telegram.org"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; display: flex; justify-content: center; align-items: center; }
        iframe { border: none; width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="player" style="width: 100%; height: 100%;"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем окно на весь экран телефона

        // 1. Скрипт забирает ID видео из ссылки Telegram (?startapp=ID)
        const videoId = tg.initDataUnsafe?.start_param;
        const container = document.getElementById('player');

        if (videoId) {
            // 2. Скрипт забирает имя и ID ученика из Telegram
            const user = tg.initDataUnsafe?.user;
            const userData = user ? `${user.first_name} (ID: ${user.id})` : "Защищенный просмотр";

            // 3. Формируем ту самую ссылку, о которой говорит Kinescope, подставляя данные
            const kinescopeUrl = `https://kinescope.io{videoId}?watermark=${encodeURIComponent(userData)}`;

            // 4. Вставляем плеер на страницу
            container.innerHTML = `<iframe src="${kinescopeUrl}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media;" allowfullscreen></iframe>`;
        } else {
            container.innerHTML = '<div style="color:#fff; text-align:center; padding-top:40vh; font-family:sans-serif;">Видео не найдено. Перейдите по ссылке из канала.</div>';
        }
    </script>
</body>
</html>
